<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokara 1v1 — uygulama simgesi</title>
<style>
  html, body { margin: 0; padding: 0; background: #171528; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2554"/>
      <stop offset="0.62" stop-color="#1d1a34"/>
      <stop offset="1" stop-color="#141322"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6b5a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6b5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4c5bdc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4c5bdc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3cbe94" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#3cbe94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#ffb43f" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff6b5a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#f3ead8" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- zemin -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <circle cx="118" cy="404" r="210" fill="url(#glowWarm)"/>
  <circle cx="430" cy="132" r="210" fill="url(#glowCool)"/>
  <circle cx="404" cy="452" r="180" fill="url(#glowMint)"/>

  <!-- çarpışma parlaması -->
  <circle cx="256" cy="238" r="140" fill="url(#flare)" opacity="0.9"/>

  <!-- sol T: sıcak -->
  <g transform="rotate(-10 160 238)">
    <rect x="104" y="146" width="60" height="60" rx="10" fill="#ff6b5a"/>
    <rect x="104" y="210" width="60" height="60" rx="10" fill="#f4b72a"/>
    <rect x="104" y="274" width="60" height="60" rx="10" fill="#ff6b5a"/>
    <rect x="168" y="210" width="60" height="60" rx="10" fill="#f4b72a"/>
  </g>

  <!-- sağ T: soğuk -->
  <g transform="rotate(10 352 238)">
    <rect x="348" y="146" width="60" height="60" rx="10" fill="#4c5bdc"/>
    <rect x="348" y="210" width="60" height="60" rx="10" fill="#3cbe94"/>
    <rect x="348" y="274" width="60" height="60" rx="10" fill="#4c5bdc"/>
    <rect x="284" y="210" width="60" height="60" rx="10" fill="#3cbe94"/>
  </g>

  <!-- çarpışma yıldızı -->
  <g transform="translate(256 240)">
    <circle r="46" fill="none" stroke="#f4b72a" stroke-width="5" opacity="0.55"/>
    <path d="M0 -58 L7.5 -15 L58 0 L7.5 15 L0 58 L-7.5 15 L-58 0 L-7.5 -15Z" fill="#fff7e2"/>
    <path d="M0 -31 L5.5 -6.5 L31 0 L5.5 6.5 L0 31 L-5.5 6.5 L-31 0 L-5.5 -6.5Z" fill="#ffcf4d"/>
    <path d="M38 -38 L18 -10 L38 10 L10 -5 L-10 38 L5 10 L-38 -5 L-10 18Z" fill="#ff9c3f" opacity="0.8"/>
    <circle r="9" fill="#fffdf5"/>
  </g>

  <!-- kıymıklar -->
  <rect x="198" y="82" width="15" height="15" rx="3.5" fill="#f3ead8" transform="rotate(22 205 89)"/>
  <rect x="332" y="378" width="13" height="13" rx="3" fill="#f3ead8" transform="rotate(-26 338 384)"/>
  <rect x="128" y="330" width="11" height="11" rx="2.6" fill="#f4b72a" transform="rotate(38 133 335)"/>
  <rect x="376" y="80" width="10" height="10" rx="2.4" fill="#3cbe94" transform="rotate(14 381 85)"/>
  <rect x="84" y="196" width="9" height="9" rx="2.2" fill="#ff6b5a" transform="rotate(-18 88 200)"/>
</svg>
</body>
</html>
