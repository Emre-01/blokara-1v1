<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokara 1v1 — öne çıkan görsel</title>
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("../public/fonts/bricolage-latin.woff2") format("woff2");
    font-weight: 400 800;
    font-display: block;
  }
  @font-face {
    font-family: "Figtree";
    src: url("../public/fonts/figtree-latin.woff2") format("woff2");
    font-weight: 400 700;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #1c1b2e; }
  body {
    font-family: "Figtree", system-ui, sans-serif;
    background: #1c1b2e;
    color: #f3ead8;
  }
  .art {
    position: relative;
    width: 512px;
    height: 250px;
    transform: scale(2);
    transform-origin: top left;
    overflow: hidden;
    background:
      radial-gradient(420px 260px at 78% 18%, rgba(84, 92, 214, 0.55), transparent 70%),
      radial-gradient(360px 240px at 12% 96%, rgba(255, 107, 90, 0.34), transparent 72%),
      radial-gradient(300px 200px at 96% 92%, rgba(60, 190, 148, 0.28), transparent 70%),
      #1c1b2e;
  }
  .art::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(243, 234, 216, 0.18) 1px, transparent 1.4px);
    background-size: 13px 13px;
    opacity: 0.55;
  }
  .copy {
    position: absolute;
    left: 30px;
    top: 26px;
    z-index: 2;
    max-width: 320px;
  }
  .kicker {
    display: inline-block;
    padding: 4px 9px;
    border: 2px solid #f3ead8;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f3ead8;
  }
  h1 {
    margin: 12px 0 0;
    font-family: "Bricolage", "Figtree", sans-serif;
    font-size: 48px;
    line-height: 0.9;
    letter-spacing: -0.045em;
    font-weight: 800;
    color: #f3ead8;
  }
  h1 em { font-style: normal; color: #ff9c3f; }
  .tag {
    margin: 10px 0 0;
    font-size: 14px;
    line-height: 1.3;
    font-weight: 500;
    color: rgba(243, 234, 216, 0.9);
  }
  .chips { display: flex; gap: 6px; margin-top: 12px; }
  .chip {
    font-size: 9.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: #f3ead8;
    color: #1c1b2e;
  }
  .chip.mint { background: #3cbe94; color: #0f2c24; }
  .chip.coral { background: #ff6b5a; color: #3a100c; }

  /* --- sağ taraf: çarpışan bloklar --- */
  .stage {
    position: absolute;
    right: 10px;
    top: 22px;
    width: 196px;
    height: 206px;
    z-index: 1;
  }
  .mini-board {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2px;
    width: 100px;
    padding: 5px;
    aspect-ratio: 1;
    background: #23213a;
    border: 2.5px solid #0e0d18;
    border-radius: 10px;
    box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.35);
  }
  .mini-board.left { left: 0; top: 26px; transform: rotate(-8deg); }
  .mini-board.right { right: 0; top: 74px; transform: rotate(7deg); }
  .mb { border-radius: 2px; background: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  .mini-board.left .mb { --c: #ff6b5a; }
  .mini-board.left .mb:nth-child(2n) { --c: #f4b72a; }
  .mini-board.right .mb { --c: #4c5bdc; }
  .mini-board.right .mb:nth-child(2n) { --c: #3cbe94; }

  .glow {
    position: absolute;
    left: 68px;
    top: 76px;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244, 183, 42, 0.55), rgba(255, 107, 90, 0.24) 48%, transparent 72%);
    z-index: 2;
  }
  .clash {
    position: absolute;
    left: 64px;
    top: 72px;
    width: 74px;
    height: 74px;
    z-index: 3;
  }
  .clash svg { width: 100%; height: 100%; overflow: visible; }
  .clash .ring { fill: none; stroke: #f4b72a; stroke-width: 3.4; opacity: 0.7; }
  .clash .star { fill: #f3ead8; filter: drop-shadow(0 0 7px rgba(244, 183, 42, 0.95)); }
  .clash .star-b { fill: #f4b72a; filter: none; opacity: 0.95; }
  .clash .core { fill: #ff9c3f; }
  .shard { position: absolute; border-radius: 2px; background: #f3ead8; z-index: 4; }
  .shard-a { width: 9px; height: 9px; left: 110px; top: 28px; transform: rotate(18deg); }
  .shard-b { width: 7px; height: 7px; left: 142px; top: 138px; transform: rotate(-24deg); }
  .shard-c { width: 6px; height: 6px; left: 66px; top: 168px; transform: rotate(34deg); background: #f4b72a; }
  .shard-d { width: 5px; height: 5px; left: 162px; top: 56px; transform: rotate(12deg); background: #3cbe94; }

  .vs {
    position: absolute;
    left: 74px;
    top: 12px;
    z-index: 5;
    font-family: "Bricolage", sans-serif;
    font-weight: 800;
    font-size: 15px;
    padding: 3px 7px;
    border-radius: 7px;
    background: #ff6b5a;
    color: #fff;
    border: 2px solid #0e0d18;
    transform: rotate(-11deg);
    box-shadow: 2px 2px 0 #0e0d18;
  }
</style>
</head>
<body>
  <div class="art">
    <div class="copy">
      <span class="kicker">2 kişilik blok oyunu</span>
      <h1>Blokara<br><em>1v1</em></h1>
      <p class="tag">Aynı tahtada omuz omuza,<br>ya da rakip olarak kapış.</p>
      <div class="chips">
        <span class="chip">Aynı cihaz</span>
        <span class="chip mint">Oda kodu</span>
        <span class="chip coral">8×8</span>
      </div>
    </div>

    <div class="stage">
      <div class="mini-board left">
        <span class="mb" style="grid-area:2/2"></span>
        <span class="mb" style="grid-area:2/3"></span>
        <span class="mb" style="grid-area:3/3"></span>
        <span class="mb" style="grid-area:4/3"></span>
        <span class="mb" style="grid-area:5/2"></span>
        <span class="mb" style="grid-area:5/3"></span>
        <span class="mb" style="grid-area:6/2"></span>
        <span class="mb" style="grid-area:7/4"></span>
        <span class="mb" style="grid-area:7/5"></span>
      </div>
      <div class="mini-board right">
        <span class="mb" style="grid-area:7/2"></span>
        <span class="mb" style="grid-area:7/3"></span>
        <span class="mb" style="grid-area:6/3"></span>
        <span class="mb" style="grid-area:5/3"></span>
        <span class="mb" style="grid-area:4/4"></span>
        <span class="mb" style="grid-area:4/5"></span>
        <span class="mb" style="grid-area:3/5"></span>
        <span class="mb" style="grid-area:2/6"></span>
        <span class="mb" style="grid-area:2/7"></span>
      </div>

      <span class="vs">VS</span>

      <span class="glow"></span>
      <div class="clash">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="ring" cx="20" cy="20" r="14"/>
          <path class="star" d="M20 4 L22.1 17.9 L36 20 L22.1 22.1 L20 36 L17.9 22.1 L4 20 L17.9 17.9Z"/>
          <path class="star star-b" d="M27.78 27.78 L23.5 20 L27.78 12.22 L20 16.5 L12.22 12.22 L16.5 20 L12.22 27.78 L20 23.5Z"/>
          <circle class="core" cx="20" cy="20" r="4"/>
        </svg>
      </div>

      <span class="shard shard-a"></span>
      <span class="shard shard-b"></span>
      <span class="shard shard-c"></span>
      <span class="shard shard-d"></span>
    </div>
  </div>
</body>
</html>
