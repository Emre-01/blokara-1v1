# Blokara 2v2 — kendi sunucunda 7/24 çalıştırma.
#   docker compose up -d      → arka planda başlar
#   docker compose logs -f    → günlükler
#
# volumes: oda/oyun verisi bellekte tutulduğu için kalıcı veri gerekmez;
# yalnızca günlükleri dışarıda tutarız.
services:
  blok-iki:
    build: .
    image: blok-iki:latest
    container_name: blok-iki
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
