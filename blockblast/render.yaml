# Render.com'da tek tıkla yayın.
# Render panelinde: New → Blueprint → bu depoyu seç. Ücretsiz plan kullanılır.
services:
  - type: web
    name: blok-iki
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: "echo 'bagimlilik yok'"
    startCommand: "node server-guard.cjs"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
